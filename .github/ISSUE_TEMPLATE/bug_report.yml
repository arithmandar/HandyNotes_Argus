name: Bug report
description: Report a problem with the HandyNotes plugin in this repository.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve this HandyNotes plugin!

        Use this form to report a problem with the plugin maintained in this repository, including missing or  incorrect map markers, tooltip information, display problems, or Lua errors.

        Please search existing issues before submitting.

        If you are unsure whether the problem comes from this plugin or HandyNotes itself, describe what you observed here.
        You do not need to diagnose the cause yourself.

        For confirmed HandyNotes core issues that are unrelated to this plugin, please use the HandyNotes core issue tracker linked in the issue chooser.

  - type: dropdown
    id: game-flavor
    attributes:
      label: WoW game flavor
      description: Which version of World of Warcraft are you using?
      options:
        - Retail (Mainline)
        - Classic Era
        - Classic progression
        - Classic Anniverssary (TBC)
        - Forever
        - Other — specify in the game version field
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: WoW version and build
      description: |
        Enter the game version and build, if available.
        For Classic or other variants, also specify the release or mode.
      placeholder: "Game version, build, and release or mode"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: |
        Enter the version of the plugin maintained in this repository.
        If testing a Git checkout, include the commit ID.
      placeholder: "Plugin version or commit ID"
    validations:
      required: true

  - type: input
    id: handynotes-version
    attributes:
      label: HandyNotes core version
      description: Enter the version of the main HandyNotes addon.
      placeholder: "HandyNotes version"
    validations:
      required: true

  - type: input
    id: affected-content
    attributes:
      label: Affected map, marker, or feature
      description: |
        Identify the affected zone, map marker, tooltip, or plugin feature.
        Include coordinates if relevant and available.
        If the problem affects the entire plugin, enter "All".
      placeholder: "Zone, marker name, coordinates, or feature"
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened?
      description: |
        Describe what is incorrect, missing, or not working.
        For marker or tooltip problems, identify the affected information.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
      description: |
        Describe the expected behavior or correct information.
        If reporting a content error, include a reference if available.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Explain how to observe the problem.
        If it happens only sometimes, describe the conditions.
      placeholder: |
        1. Log in with...
        2. Open the map for...
        3. Hover over or click...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: character-context
    attributes:
      label: Relevant character or progression details
      description: |
        If relevant, include your character's class, faction, level, quest progress, or other conditions associated with the problem.
        Do not include character names or other personal information.

  - type: input
    id: client-language
    attributes:
      label: WoW client language
      description: Especially helpful for text, font, or translation problems.
      placeholder: "For example: enUS, zhTW, deDE"

  - type: textarea
    id: lua-errors
    attributes:
      label: Lua errors
      description: Paste the full Lua error, if one appears.
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots and additional context
      description: |
        Add screenshots, references, or other information that may help.
        If you tested with unrelated addons disabled, include the result.
        For compatibility problems, list the relevant addons and versions.